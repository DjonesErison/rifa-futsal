<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Rifa Náthaly</title><style>
:root{--y:#ffd400;--d:#071713;--r:#ef4444;--b:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f2;color:#122019}header{background:var(--d);color:#fff;padding:18px 5%;border-bottom:4px solid var(--y)}header div{max-width:1100px;margin:auto;font-weight:900;font-size:22px}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 18px #0001}.login{max-width:420px;margin:70px auto}.login input{width:100%;padding:14px;margin:7px 0;border:1px solid #ccd4cf;border-radius:9px;font-size:16px}.btn{border:0;border-radius:9px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:var(--y);width:100%}.logout{float:right;background:#e8ece9}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat{background:#fff;border-radius:12px;padding:18px;text-align:center}.stat strong{display:block;font-size:28px}.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.toolbar button{background:#fff;border:1px solid #ccd4cf}.toolbar button.active{background:var(--d);color:#fff}.tablewrap{overflow:auto;background:#fff;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;border-bottom:1px solid #e6eae7;text-align:left}.reservado{color:var(--r);font-weight:900}.pago{color:var(--b);font-weight:900}.pay{background:var(--b);color:#fff}.release{background:#e8ece9}.delete{background:#b42318;color:#fff}.msg{margin-top:10px;color:#b42318}@media(max-width:650px){.stats{grid-template-columns:1fr}.wrap{margin-top:18px}}
</style></head><body><header><div>⚽ Administração • Rifa Náthaly</div></header><main class="wrap">
<section id="loginCard" class="card login"><h1>Acesso administrativo</h1><label>Usuário</label><input id="user" value="adm" readonly><label>Senha</label><input id="pass" type="password" placeholder="Sua senha"><button class="btn primary" id="loginBtn">Entrar</button><div class="msg" id="loginMsg"></div></section>
<section id="panel" class="hidden"><div class="card"><button class="btn logout" id="logoutBtn">Sair</button><h1>Painel administrativo</h1><p>Reservas e pagamentos da campanha.</p></div><div class="stats"><div class="stat"><strong id="sAvail">-</strong>Disponíveis</div><div class="stat"><strong id="sRes">-</strong>Reservados</div><div class="stat"><strong id="sPaid">-</strong>Pagos</div><div class="stat"><strong id="sMoney">R$ 0,00</strong>Valor arrecadado</div></div><div class="toolbar"><button class="btn active" data-filter="todos">Todos</button><button class="btn" data-filter="reservado">Reservados</button><button class="btn" data-filter="pago">Pagos</button><button class="btn" id="refreshBtn">↻ Atualizar</button></div><div class="tablewrap"><table><thead><tr><th>Número</th><th>Status</th><th>Nome</th><th>WhatsApp</th><th>Reserva</th><th>Expira</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const SB='https://qlpnugxxhimnmazhopsj.supabase.co';
const KEY='sb_publishable_Yeax79PcMt4cKCFQlxjxkw_l-iPihW4';
const loginCard=document.getElementById('loginCard'),panel=document.getElementById('panel'),loginMsg=document.getElementById('loginMsg'),passInput=document.getElementById('pass'),rows=document.getElementById('rows');
let token=sessionStorage.getItem('rifa_admin_token')||'',items=[],filter='todos';
async function req(path,opt={}){opt.headers=Object.assign({'apikey':KEY,'Content-Type':'application/json'},opt.headers||{});if(token)opt.headers.Authorization='Bearer '+token;const r=await fetch(SB+path,opt);const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error((data&&data.message)||(data&&data.msg)||(data&&data.error_description)||text||('HTTP '+r.status));return data}
async function rpc(name,args={}){return req('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(args)})}
function showLogin(){loginCard.classList.remove('hidden');panel.classList.add('hidden')}function showPanel(){loginCard.classList.add('hidden');panel.classList.remove('hidden');load()}
async function doLogin(){loginMsg.textContent='Entrando...';try{const d=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:'adm@rifa-nathaly.local',password:passInput.value})});token=d.access_token;sessionStorage.setItem('rifa_admin_token',token);const ok=await rpc('eh_admin');if(ok!==true)throw new Error('Usuário autenticado sem permissão administrativa');loginMsg.textContent='';showPanel()}catch(err){token='';sessionStorage.removeItem('rifa_admin_token');loginMsg.textContent='Erro: '+err.message}}
document.getElementById('loginBtn').onclick=doLogin;passInput.onkeydown=e=>{if(e.key==='Enter')doLogin()};
document.getElementById('logoutBtn').onclick=()=>{token='';sessionStorage.removeItem('rifa_admin_token');showLogin()};
async function load(){try{await rpc('liberar_reservas_vencidas');const pub=await req('/rest/v1/numeros_publicos?select=numero,status&order=numero');items=await rpc('listar_reservas_admin');document.getElementById('sAvail').textContent=pub.filter(x=>x.status==='disponivel').length;document.getElementById('sRes').textContent=pub.filter(x=>x.status==='reservado').length;const paid=pub.filter(x=>x.status==='pago').length;document.getElementById('sPaid').textContent=paid;document.getElementById('sMoney').textContent=(paid*10).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});render()}catch(err){rows.innerHTML='<tr><td colspan="7">Erro: '+esc(err.message)+'</td></tr>'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function dt(x){return x?new Date(x).toLocaleString('pt-BR'):'-'}
function render(){const a=items.filter(x=>filter==='todos'||x.status===filter);rows.innerHTML=a.length?a.map(x=>'<tr><td><b>'+String(x.numero).padStart(3,'0')+'</b></td><td class="'+x.status+'">'+x.status.toUpperCase()+'</td><td>'+esc(x.nome)+'</td><td>'+esc(x.whatsapp)+'</td><td>'+dt(x.reservado_em)+'</td><td>'+dt(x.expira_em)+'</td><td>'+(x.status==='reservado'?'<button class="btn pay" data-pay="'+x.numero+'">Marcar pago</button> <button class="btn release" data-release="'+x.numero+'">Liberar</button> <button class="btn delete" data-delete="'+x.numero+'">Excluir</button>':'<button class="btn delete" data-delete="'+x.numero+'">Excluir</button>')+'</td></tr>').join(''):'<tr><td colspan="7">Nenhum registro.</td></tr>';document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>pay(+b.dataset.pay));document.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>releaseN(+b.dataset.release));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteN(+b.dataset.delete))}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});document.getElementById('refreshBtn').onclick=load;
async function pay(n){if(!confirm('Confirmar pagamento do número '+String(n).padStart(3,'0')+'?'))return;try{await rpc('confirmar_pagamento',{p_numeros:[n]});load()}catch(e){alert(e.message)}}
async function deleteN(n){if(!confirm('Excluir esta participação? O número voltará a ficar disponível.'))return;try{await rpc('excluir_participacao_admin',{p_numero:n});load()}catch(e){alert(e.message)}}
async function releaseN(n){if(!confirm('Liberar reserva do número '+String(n).padStart(3,'0')+'?'))return;try{await rpc('liberar_reserva_admin',{p_numero:n});load()}catch(e){alert(e.message)}}
if(token){rpc('eh_admin').then(ok=>ok===true?showPanel():showLogin()).catch(showLogin)}else showLogin();
</script></body></html>
