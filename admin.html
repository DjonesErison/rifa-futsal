<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Rifa Náthaly</title><style>
:root{--y:#ffd400;--d:#071713;--r:#ef4444;--b:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f5f2;color:#122019}header{background:var(--d);color:#fff;padding:18px 5%;border-bottom:4px solid var(--y)}header div{max-width:1100px;margin:auto;font-weight:900;font-size:22px}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 18px #0001}.login{max-width:420px;margin:70px auto}.login input{width:100%;padding:14px;margin:7px 0;border:1px solid #ccd4cf;border-radius:9px;font-size:16px}.btn{border:0;border-radius:9px;padding:12px 15px;font-weight:800;cursor:pointer}.primary{background:var(--y);width:100%}.logout{float:right;background:#e8ece9}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat{background:#fff;border-radius:12px;padding:18px;text-align:center}.stat strong{display:block;font-size:28px}.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.toolbar button{background:#fff;border:1px solid #ccd4cf}.toolbar button.active{background:var(--d);color:#fff}.tablewrap{overflow:auto;background:#fff;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;border-bottom:1px solid #e6eae7;text-align:left}.reservado{color:var(--r);font-weight:900}.pago{color:var(--b);font-weight:900}.pay{background:var(--b);color:#fff}.release{background:#e8ece9}.msg{margin-top:10px;color:#b42318}@media(max-width:650px){.stats{grid-template-columns:1fr}.wrap{margin-top:18px}}
</style></head><body><header><div>⚽ Administração • Rifa Náthaly</div></header><main class="wrap">
<section id="loginCard" class="card login"><h1>Acesso administrativo</h1><label>Usuário</label><input id="user" value="adm" readonly><label>Senha</label><input id="pass" type="password" placeholder="Sua senha"><button class="btn primary" id="loginBtn">Entrar</button><div class="msg" id="loginMsg"></div></section>
<section id="panel" class="hidden"><div class="card"><button class="btn logout" id="logoutBtn">Sair</button><h1>Painel administrativo</h1><p>Reservas e pagamentos da campanha.</p></div><div class="stats"><div class="stat"><strong id="sAvail">-</strong>Disponíveis</div><div class="stat"><strong id="sRes">-</strong>Reservados</div><div class="stat"><strong id="sPaid">-</strong>Pagos</div></div><div class="toolbar"><button class="btn active" data-filter="todos">Todos</button><button class="btn" data-filter="reservado">Reservados</button><button class="btn" data-filter="pago">Pagos</button><button class="btn" id="refreshBtn">↻ Atualizar</button></div><div class="tablewrap"><table><thead><tr><th>Número</th><th>Status</th><th>Nome</th><th>WhatsApp</th><th>Reserva</th><th>Expira</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const URL='https://qlpnugxxhimnmazhopsj.supabase.co';
const KEY='sb_publishable_Yeax79PcMt4cKCFQlxjxkw_l-iPihW4';
const API=URL+'/rest/v1/rpc/';
let token=null;
async function apiRpc(fn,body={},auth=true){const h={'apikey':KEY,'Content-Type':'application/json'};if(auth&&token)h.Authorization='Bearer '+token;const r=await fetch(API+fn,{method:'POST',headers:h,body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw new Error(t);try{return JSON.parse(t)}catch{return t}}
async function signIn(password){const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:'adm@rifa-nathaly.local',password})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'Falha no login');token=d.access_token;sessionStorage.setItem('rifa_admin_token',token);return d}
const db={
 auth:{getSession:async()=>({data:{session:(token=sessionStorage.getItem('rifa_admin_token'))?{access_token:token}:null}}),signInWithPassword:async({password})=>{try{const data=await signIn(password);return{data,error:null}}catch(error){return{data:null,error}}},signOut:async()=>{token=null;sessionStorage.removeItem('rifa_admin_token')}},
 rpc:async(fn,args={})=>{try{return{data:await apiRpc(fn,args),error:null}}catch(error){return{data:null,error}}},
 from:(name)=>({select:()=>({then:async(resolve)=>{try{const h={'apikey':KEY};if(token)h.Authorization='Bearer '+token;const r=await fetch(URL+'/rest/v1/'+name+'?select=numero,status',{headers:h});const data=await r.json();resolve({data,error:r.ok?null:new Error(JSON.stringify(data))})}catch(error){resolve({data:null,error})}}})})
};
let items=[],filter='todos';
const loginCard=document.getElementById('loginCard'),panel=document.getElementById('panel'),rows=document.getElementById('rows'),passInput=document.getElementById('pass'),loginMsg=document.getElementById('loginMsg');
async function check(){const {data:{session}}=await db.auth.getSession();if(session){const {data}=await db.rpc('eh_admin');data?showPanel():await db.auth.signOut()}else showLogin()}
function showLogin(){loginCard.classList.remove('hidden');panel.classList.add('hidden')}function showPanel(){loginCard.classList.add('hidden');panel.classList.remove('hidden');load()}
passInput.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click()});document.getElementById('loginBtn').onclick=async()=>{loginMsg.textContent='Entrando...';const {error}=await db.auth.signInWithPassword({email:'adm@rifa-nathaly.local',password:passInput.value});if(error){loginMsg.textContent='Falha no login: '+error.message;console.error('Supabase login:',error);return}const {data,error:e}=await db.rpc('eh_admin');if(e||!data){await db.auth.signOut();loginMsg.textContent='Login aceito, mas o acesso administrativo falhou: '+(e?e.message:'usuário não autorizado');console.error('Admin check:',e);return}loginMsg.textContent='';showPanel()};
document.getElementById('logoutBtn').onclick=async()=>{await db.auth.signOut();showLogin()};
async function load(){await db.rpc('liberar_reservas_vencidas');const [pub,adm]=await Promise.all([db.from('numeros_publicos').select('numero,status'),db.rpc('listar_reservas_admin')]);if(adm.error){rows.innerHTML='<tr><td colspan="7">'+adm.error.message+'</td></tr>';return}items=adm.data||[];const all=pub.data||[];document.getElementById('sAvail').textContent=all.filter(x=>x.status==='disponivel').length;document.getElementById('sRes').textContent=all.filter(x=>x.status==='reservado').length;document.getElementById('sPaid').textContent=all.filter(x=>x.status==='pago').length;render()}
function dt(x){return x?new Date(x).toLocaleString('pt-BR'):'-'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const a=items.filter(x=>filter==='todos'||x.status===filter);rows.innerHTML=a.length?a.map(x=>'<tr><td><b>'+String(x.numero).padStart(3,'0')+'</b></td><td class="'+x.status+'">'+x.status.toUpperCase()+'</td><td>'+esc(x.nome)+'</td><td>'+esc(x.whatsapp)+'</td><td>'+dt(x.reservado_em)+'</td><td>'+dt(x.expira_em)+'</td><td>'+(x.status==='reservado'?'<button class="btn pay" onclick="pay('+x.numero+')">Marcar pago</button> <button class="btn release" onclick="releaseN('+x.numero+')">Liberar</button>':'-')+'</td></tr>').join(''):'<tr><td colspan="7">Nenhum registro.</td></tr>'}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});document.getElementById('refreshBtn').onclick=load;
window.pay=async function(n){if(!confirm('Confirmar pagamento do número '+String(n).padStart(3,'0')+'?'))return;const {error}=await db.rpc('confirmar_pagamento',{p_numeros:[n]});if(error)alert(error.message);else load()}
window.releaseN=async function(n){if(!confirm('Liberar a reserva do número '+String(n).padStart(3,'0')+'?'))return;const {error}=await db.rpc('liberar_reserva_admin',{p_numero:n});if(error)alert(error.message);else load()}check();

</script></body></html>
